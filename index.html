<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>EcoRoute AI — Verified Destination Copilot</title>
  </head>
  <body>
    <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui;color:#6ee7b7;text-align:center;padding:24px;white-space:pre-wrap;font-size:14px;line-height:1.5;">EcoRoute AI — booting…</div>
    <div id="root"></div>
    <script>
      window.__mounted = false;
      function showBoot(msg, color) {
        var b = document.getElementById('boot');
        if (b) { b.style.color = color || '#6ee7b7'; b.textContent = msg; }
      }
      window.addEventListener('error', function (e) {
        var detail = (e.message || (e.error && e.error.message) || 'Unknown error');
        var where = e.filename ? ('\n' + e.filename + ':' + (e.lineno || '')) : '';
        showBoot('PAGE ERROR:\n' + detail + where, '#fca5a5');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; showBoot('PROMISE ERROR:\n' + (r && r.message ? r.message : r), '#fca5a5');
      });
      setTimeout(function () {
        if (!window.__mounted) {
          showBoot(
            'React did NOT mount after 5s.\n\nLikely causes:\n• npm install did not finish (no node_modules / missing packages)\n• a module failed to load (check DevTools Console, F12)\n• wrong port — Vite may be on http://localhost:5174\n\nOpen this file directly to confirm it loads:\nhttp://localhost:5173/src/main.jsx',
            '#fbbf24'
          );
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
